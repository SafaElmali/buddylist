<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: pack:; media-src 'self'"
    />
    <title>Welcome to buddylist</title>
    <link rel="stylesheet" href="styles/theme.css" />
    <link rel="stylesheet" href="styles/pro-theme.css" />
    <link rel="stylesheet" href="styles/palettes.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/frame.css" />
    <link rel="stylesheet" href="styles/onboarding.css" />
    <link rel="stylesheet" href="styles/pro.css" />
    <!-- Nothing is drawn until the script has said which look the window is in. -->
    <script type="module" src="onboarding/main.js" blocking="render"></script>
  </head>
  <body>
    <div class="window">
      <header class="titlebar"></header>
      <div class="window-body ob">
        <aside class="ob-side">
          <!-- The app icon, drawn by `npm run icon` (scripts/make-icon.js) at this size and twice it. -->
          <div class="ob-mark">
            <img src="pictures/app-icon-48.png" srcset="pictures/app-icon-48@2x.png 2x" width="48" height="48" alt="" />
            <span>buddylist</span>
          </div>
          <ol class="ob-steps" id="steps"></ol>
        </aside>
        <main class="ob-page" id="page"></main>
        <footer class="ob-foot">
          <button class="link" id="skip" type="button">Skip</button>
          <button class="btn" id="back" type="button">&lt; Back</button>
          <button class="btn default" id="next" type="button">Next &gt;</button>
        </footer>
      </div>
    </div>
  </body>
</html>
