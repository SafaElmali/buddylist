<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: pack:"
    />
    <title>buddylist</title>
    <link rel="stylesheet" href="styles/theme.css" />
    <link rel="stylesheet" href="styles/pro-theme.css" />
    <link rel="stylesheet" href="styles/palettes.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/toast.css" />
    <link rel="stylesheet" href="styles/pro.css" />
    <!-- Nothing is drawn until the script has said which look the window is in. -->
    <script type="module" src="toast/main.js" blocking="render"></script>
  </head>
  <body>
    <div class="toast" id="toast">
      <div class="toast-head">
        <span class="toast-mark" id="mark"></span>
        <span class="toast-app">buddylist</span>
        <button class="toast-close" id="close" type="button" aria-label="Close">✕</button>
      </div>
      <div class="toast-body">
        <div id="picture"></div>
        <div class="toast-text">
          <div class="toast-title" id="title"></div>
          <div class="toast-message" id="message"></div>
        </div>
      </div>
      <div class="toast-foot"><a id="options">Options</a></div>
    </div>
  </body>
</html>
