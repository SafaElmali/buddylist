<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: pack:; media-src 'self' pack:"
    />
    <title>Spending</title>
    <link rel="stylesheet" href="styles/theme.css" />
    <link rel="stylesheet" href="styles/pro-theme.css" />
    <link rel="stylesheet" href="styles/palettes.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/frame.css" />
    <link rel="stylesheet" href="styles/spending.css" />
    <link rel="stylesheet" href="styles/pro.css" />
    <!-- Nothing is drawn until the script has said which look the window is in. -->
    <script type="module" src="spending/main.js" blocking="render"></script>
  </head>
  <body>
    <div class="window">
      <header class="titlebar"></header>
      <nav class="menubar"></nav>
      <div class="window-body">
        <div class="sp-main">
          <section class="sp-totals" id="totals" aria-label="Totals"></section>
          <section class="sp-list" id="contacts" role="table" aria-label="Spending by contact" tabindex="0"></section>
        </div>
        <footer class="sp-status" id="status" role="status">Loading spending...</footer>
      </div>
    </div>
  </body>
</html>
