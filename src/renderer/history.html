<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: pack:; media-src 'self' pack:"
    />
    <title>Message History</title>
    <link rel="stylesheet" href="styles/theme.css" />
    <link rel="stylesheet" href="styles/pro-theme.css" />
    <link rel="stylesheet" href="styles/palettes.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/frame.css" />
    <link rel="stylesheet" href="styles/chat.css" />
    <link rel="stylesheet" href="styles/history.css" />
    <link rel="stylesheet" href="styles/pro.css" />
    <!-- Nothing is drawn until the script has said which look the window is in. -->
    <script type="module" src="history/main.js" blocking="render"></script>
  </head>
  <body>
    <div class="window">
      <header class="titlebar"></header>
      <nav class="menubar"></nav>
      <div class="window-body">
        <div class="hs-bar">
          <input
            class="input"
            id="search"
            placeholder="Find in message history..."
            spellcheck="false"
            aria-label="Find in message history"
          />
          <span class="spacer"></span>
          <button class="btn" id="continue" type="button" disabled>Continue</button>
          <button class="btn" id="save" type="button" disabled>Save as...</button>
          <button class="btn" id="delete" type="button" disabled>Delete</button>
          <button class="btn" id="delete-all" type="button" disabled>Delete all</button>
        </div>
        <!-- Why the conversation picked can't be continued or deleted, and the way on when there is one. -->
        <div class="hs-note" id="note" role="status" hidden></div>

        <div class="hs-main">
          <nav class="hs-list" id="list" tabindex="0" aria-label="Conversations"></nav>
          <section class="hs-pane">
            <div class="to-line" id="about" hidden></div>
            <div class="conversation" id="conversation"></div>
          </section>
        </div>

        <footer class="statusbar" id="statusbar"></footer>
      </div>
    </div>
  </body>
</html>
