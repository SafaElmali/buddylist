<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfcfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10141b" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="buddylist" />
    <link rel="manifest" href="/src/renderer/phone/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/src/renderer/phone/icons/apple-touch-icon.png" />
    <title>buddylist</title>
    <link rel="stylesheet" href="login.css" />
    <script type="module" src="login.js"></script>
  </head>
  <body>
    <form class="sign-in" id="pair">
      <h1>buddylist</h1>
      <p class="sign-in-why" id="why" hidden></p>
      <p id="code-hint">
        Type the code buddylist shows on your computer, under Settings &gt; Remote access &gt; Pair a phone (Pair
        another phone once one is paired).
      </p>
      <label for="code">Code</label>
      <div class="sign-in-field">
        <input
          id="code"
          name="code"
          autocomplete="one-time-code"
          autocapitalize="characters"
          autocorrect="off"
          spellcheck="false"
          placeholder="XXXX-XXXX"
          aria-describedby="code-hint"
          required
          autofocus
        />
        <p class="sign-in-problem" id="code-problem" role="alert"></p>
      </div>
      <button type="submit">Pair</button>
      <button class="sign-in-switch" type="button" data-show="sign-in">Use the password instead</button>
    </form>
    <form class="sign-in" id="sign-in" hidden>
      <h1>buddylist</h1>
      <p id="password-hint">Enter the remote password set in buddylist on your computer.</p>
      <label for="password">Password</label>
      <div class="sign-in-field">
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          aria-describedby="password-hint"
          required
        />
        <p class="sign-in-problem" id="password-problem" role="alert"></p>
      </div>
      <button type="submit">Sign in</button>
      <button class="sign-in-switch" type="button" data-show="pair">Use a code instead</button>
    </form>
  </body>
</html>
