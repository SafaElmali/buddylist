<!doctype html>
<!-- The phone app: what a phone, or another computer, is given at "/" while Settings > Remote access is on (see
     src/main/remote/host.js). Its policy is a header, and its palette is the user's, in the page (see phonePage in
     web.js). A build of the app gives its bundle in place of these scripts and stylesheets (buildPhone in
     scripts/build-app.js). -->
<html lang="en" data-look="professional" data-palette="blue">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f4f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141922" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="buddylist" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/src/renderer/phone/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/src/renderer/phone/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/src/renderer/phone/icons/icon-192.png" />
    <title>buddylist</title>
    <link rel="stylesheet" href="/src/renderer/styles/theme.css" />
    <link rel="stylesheet" href="/src/renderer/styles/pro-theme.css" />
    <link rel="stylesheet" href="/src/renderer/styles/palettes.css" />
    <link rel="stylesheet" href="/src/renderer/phone/phone.css" />
    <script type="module" src="/remote/messenger.js"></script>
    <script type="module" src="/src/renderer/phone/main.js"></script>
  </head>
  <body>
    <div class="ph-connection" id="connection" hidden></div>
    <main id="screen" class="ph-screen">
      <!-- From the first paint, before any script has loaded: then main.js draws Home, or says why not. -->
      <header class="ph-bar"><h1 class="ph-title">buddylist</h1></header>
      <div class="ph-scroll ph-boot"><p class="ph-boot-title">Connecting to your computer…</p></div>
    </main>
    <!-- What a screen reader is told as it happens (announce.js): the screen itself is no live region. -->
    <div class="ph-announcer" id="announcer" role="status" aria-live="polite" aria-atomic="false"></div>
  </body>
</html>
