<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: pack: https://avatars.githubusercontent.com; media-src 'self' pack:"
    />
    <title>Conversation</title>
    <link rel="stylesheet" href="styles/theme.css" />
    <link rel="stylesheet" href="styles/pro-theme.css" />
    <link rel="stylesheet" href="styles/palettes.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/frame.css" />
    <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="styles/contact-list.css" />
    <link rel="stylesheet" href="styles/chat.css" />
    <link rel="stylesheet" href="styles/settings.css" />
    <link rel="stylesheet" href="styles/pro.css" />
    <link rel="stylesheet" href="styles/pr-stack.css" />
    <!-- Nothing is drawn until the script has run: by then the window knows whether your contacts
         are listed beside the conversation, so the conversation is where it stays from the start. -->
    <script type="module" src="chat/main.js" blocking="render"></script>
  </head>
  <body>
    <div class="window">
      <header class="titlebar"></header>
      <nav class="menubar"></nav>
      <div class="window-body">
        <div class="toolbar" id="toolbar" role="toolbar"></div>

        <div class="chat-main">
          <aside class="contacts-pane" id="contacts-pane" aria-label="Contacts" hidden>
            <nav class="cl-nav" id="nav" aria-label="Quick links"></nav>
            <div class="contacts-pane-bar">
              <span class="contacts-pane-title">Contacts</span>
              <button
                class="contacts-pane-menu"
                type="button"
                title="Group and sort the list"
                aria-haspopup="menu"
              ></button>
            </div>
            <div class="cl-list" id="contact-list" tabindex="0"></div>
            <button
              class="contacts-pane-add"
              id="add-project"
              type="button"
              title="Open a project, clone one from GitHub, or start a new one"
              aria-haspopup="menu"
            >
              <span class="contacts-pane-add-icon"></span>
              <span>Add project</span>
            </button>
          </aside>
          <div
            class="chat-splitter"
            id="contacts-splitter"
            role="separator"
            aria-orientation="vertical"
            title="Drag to resize. Double-click to put it back."
            hidden
          ></div>

          <section class="chat-left">
            <div class="chat-tabs" id="chat-tabs"></div>
            <div class="to-line" id="to-line"></div>
            <!-- An archived contact's conversation is read here: that it is, with Restore (see archived-bar.js). -->
            <div class="archived-bar" id="archived-bar" role="status" hidden></div>
            <div class="pin-bar" id="pin-bar" hidden></div>
            <div class="conversation" id="conversation" aria-live="polite"></div>
            <button
              class="to-latest"
              id="to-latest"
              type="button"
              title="Go to the newest message"
              aria-label="Go to the newest message"
              hidden
            ></button>
            <!-- A conversation an agent drafted: who did, with Start and Delete, over the message box (see draft-bar.js). -->
            <div class="draft-bar" id="draft-bar" role="status" hidden></div>
            <!-- What you sent that waits to be read, until it is: over the message box (see queue-tray.js). -->
            <div class="queue-tray" id="queue-tray" hidden></div>
            <span class="queue-said" id="queue-said" role="status"></span>
            <div class="compose-tools" id="compose-tools"></div>
            <div class="compose">
              <div class="compose-box">
                <div class="editing-bar" id="editing-bar" hidden></div>
                <div class="attachments" id="attachments" hidden></div>
                <textarea id="input" spellcheck="true" aria-label="Message" aria-describedby="next-hint"></textarea>
                <span id="next-hint" hidden></span>
                <kbd class="next-key" id="next-key" aria-hidden="true" hidden>Tab</kbd>
              </div>
              <div class="send-col">
                <button class="send-btn" id="send" type="button" disabled>Send</button>
                <!-- Messenger keeps its classic Search button; Professional uses Find in the menu or keyboard. -->
                <button class="search-btn" id="search" type="button" title="Search this conversation">Search</button>
              </div>
            </div>
          </section>

          <aside class="side-pane" id="side-pane" aria-label="Side pane" hidden></aside>
        </div>

        <footer class="statusbar">
          <div class="status-line" id="statusbar"></div>
          <!-- What a first Esc says in the status bar, read out as it comes (see stop-key.js). -->
          <span class="status-said" id="stop-said" role="status"></span>
          <button class="context-meter" id="context-meter" type="button" hidden></button>
        </footer>
      </div>
    </div>
    <div class="drop-hint" id="drop-hint" hidden><span>Drop files here to send them</span></div>
  </body>
</html>
