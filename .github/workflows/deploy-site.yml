name: Deploy site

on:
  push:
    branches: [main]
    # Keep both filters in sync. The site embeds the app's browser demo.
    paths:
      - 'site/**'
      - 'preview/**'
      - 'src/renderer/**'
      - 'src/shared/**'
      - 'src/pack/**'
      - 'src/main/app-tools.js'
      - 'src/main/branch-naming.js'
      - 'src/main/conversations.js'
      - 'src/main/relay.js'
      - 'src/main/storage/archive.js'
      - 'src/main/turns.js'
      - 'src/providers/base-session.js'
      - 'src/providers/demo/**'
      - 'src/providers/*/descriptor.js'
      - 'scripts/build-site.js'
      - 'scripts/build-web-preview.js'
      - 'scripts/notices.js'
      - 'scripts/site-*.js'
      - 'build/icon-128.png'
      - 'docs/screenshot.png'
      # The guides are the docs' pages (scripts/site-docs.js).
      - 'docs/*.md'
      - 'test/site-*.test.js'
      - 'test/feedback-endpoint.test.js'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'preview/**'
      - 'src/renderer/**'
      - 'src/shared/**'
      - 'src/pack/**'
      - 'src/main/app-tools.js'
      - 'src/main/branch-naming.js'
      - 'src/main/conversations.js'
      - 'src/main/relay.js'
      - 'src/main/storage/archive.js'
      - 'src/main/turns.js'
      - 'src/providers/base-session.js'
      - 'src/providers/demo/**'
      - 'src/providers/*/descriptor.js'
      - 'scripts/build-site.js'
      - 'scripts/build-web-preview.js'
      - 'scripts/notices.js'
      - 'scripts/site-*.js'
      - 'build/icon-128.png'
      - 'docs/screenshot.png'
      # The guides are the docs' pages (scripts/site-docs.js).
      - 'docs/*.md'
      - 'test/site-*.test.js'
      - 'test/feedback-endpoint.test.js'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      SITE_URL: ${{ vars.SITE_URL }}
      # The PostHog project the pages count their visitors in: without it they count nothing.
      POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
    steps:
      # The whole history, so the sitemap and the docs say the day each page last changed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The site needs esbuild's platform package, but no Electron or native addons.
      - name: Install site dependencies
        run: npm ci --ignore-scripts
      - name: Test site metadata, redirects, changelog, docs and forms
        run: node --test test/site-seo.test.js test/site-redirect.test.js test/site-changelog.test.js test/site-docs.test.js test/site-downloads.test.js test/feedback-endpoint.test.js
      - name: Check published downloads
        id: downloads
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: node scripts/site-downloads.js
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check site build
        if: steps.downloads.outputs.ready != 'true'
        run: npm run build:site
      # Wrangler runs build:site before uploading the site and its browser demo.
      - name: Build and deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.downloads.outputs.ready == 'true'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Set the CLOUDFLARE_API_TOKEN repository secret'; exit 1; }
          npm run deploy:site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
